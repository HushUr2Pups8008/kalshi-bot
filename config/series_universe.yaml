# Politics series universe. The root is a list. mode live may POST.
# mode paper is scored and cannot POST. mode off admits nothing.
# A missing or invalid file admits nothing.
# Favorite bands are integer cents. The gate converts them to the same
# half-open prices the desk already uses (90c and 99c stay outside).
- series: KXTRUTHSOCIAL
  mode: live
  favorite_lo_cents: 36
  favorite_hi_cents: 90
  transcript_skip: false
  paper_score: false
  notes: >-
    Truth Social weekly counts. Favorite band is 36c through 90c.
    90c is outside the half-open band. The 0-35c executed-ask
    exclusion is not applied on top of this band.
