- series: KXTRUMPMENTION
  mode: paper
  favorite_lo_cents: 55
  favorite_hi_cents: 99
  transcript_skip: true
  paper_score: true
  notes: >-
    The file records mode paper. Until EVENT_NEWS_LIVE_TRADABLE_RESEARCH
    is true, decisions still treat this row as live: prewarm fetches it
    and returns mention_requires_transcript, and live does not POST.
    Paper scoring skips the transcript gate. A run with no probability
    logs veto_not_called and does not call Grok.
