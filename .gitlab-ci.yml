# Kalshi-bot CI pipeline (Proposal A — PROFIT-EDGE-004 follow-up).
#
# Three jobs run on every push to main and every merge request:
#   - lint        : ruff check across the repo
#   - tests       : full pytest suite (1421 cases at the time of this commit)
#   - sims_smoke  : the simulation-buildout smoke subset (37 cases) by itself,
#                   so a regression in the simulation harnesses surfaces with
#                   a focused failure rather than getting buried in a 1421-case
#                   summary
#
# Compute budget: free-tier GitLab.com SaaS gives 400 compute minutes/month
# on the HushUr2Pups8008 namespace (verified 2026-05-02). Each pipeline run
# costs ~2 minutes (mostly pip install). Budget caps at ~200 pushes/month.
#
# What this pipeline does NOT do:
#   - Hit Ollama / Anthropic / Kalshi (tests use FakeLLM + FakeStore + tempdirs)
#   - Run the bot itself
#   - Touch the production trade-log archive or paper_trades.db
#   - Force-push, rewrite history, or modify branch state
#
# tests/conftest.py sets KALSHI_LOG_ROOT to a tempdir before collection, so
# logging is isolated from any logs/app paths the SaaS runner happens to have.

image: python:3.14-slim

# Pip cache lives in the project dir so the SaaS runner can persist it
# between jobs in the same pipeline (and between pipelines on the same
# branch via the cache key).
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"
  # Force pip to fail loudly on resolver problems instead of silently
  # falling back to legacy resolution.
  PIP_USE_PEP517: "1"

cache:
  key:
    files:
      - requirements.txt
      - requirements-dev.txt
  paths:
    - .cache/pip
    - .venv/

# Shared install — extracted into a YAML anchor so each job's before_script
# stays one line.
.install: &install
  - python -m venv .venv
  - .venv/bin/pip install --upgrade pip wheel
  - .venv/bin/pip install -r requirements-dev.txt

stages:
  - lint
  - test

lint:
  stage: lint
  before_script:
    - *install
  script:
    - .venv/bin/ruff check .
    # README ↔ VERSION drift gate — see scripts/sync_readme_version.py.
    # Catches a hand-edit or a forgotten pre-commit hook (the hook is
    # the convenience layer; this is the safety net).
    - .venv/bin/python scripts/sync_readme_version.py --check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

tests:
  stage: test
  before_script:
    # Tests subprocess `git` (db_snapshot, close_day audit, wave1 acceptance audit),
    # `node` (wave2_branch_a_invariant_check.sh JSON probe), `make` (Makefile
    # operator-target dry-run tests added in 50f7aac), and `sqlite3`
    # (bothealth shell verdict regression). python:3.14-slim is Debian-based
    # and ships none of them; install all four before pytest collection.
    - apt-get update -qq && apt-get install -y --no-install-recommends git nodejs make sqlite3
    - *install
  script:
    - .venv/bin/python -m pytest -q --tb=short --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

sims_smoke:
  # Focused subset — runs the simulation-buildout smoke tests on their own so
  # a regression in the harnesses (PROFIT-EDGE-004 deliverable) is highlighted
  # rather than absorbed into the 1421-test summary.
  stage: test
  before_script:
    - *install
  script:
    - .venv/bin/python -m pytest tests/test_simulations_smoke.py -q --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

p0_gate:
  # PROFIT-API-001 (Kalshi API Contract Stabilization) P0 closure gate.
  # Runs the P0 targeted suite on its own so a regression in the API-contract
  # parse boundary, fixed-point pricing, fail-closed exchange-status gate,
  # drift-counter halt, signing fail-fast, or replay cohort boundary surfaces
  # with a focused failure rather than being absorbed into the full pytest run.
  #
  # The fixture-pinning test (test_p0_fixture_pinning_sha256 in
  # tests/test_kalshi_normalizer_p0.py) enforces sha256 of the captured
  # Kalshi response fixtures under tests/fixtures/kalshi_payloads/. Any
  # accidental edit to a fixture fails this job. Captured fixtures are
  # P0-gate evidence per the canonical roadmap §11.5 lockdown.
  #
  # This job hits zero live endpoints; tests use captured JSON fixtures
  # only. No KALSHI / Anthropic / Ollama secrets are required.
  #
  # The two WS placeholder tests in `tests/test_kalshi_pricing_p0.py`
  # (`test_p0_ws_015_ws_midpoint_does_not_overwrite_rest_executable` and
  # `test_p0_ws_016_ws_no_data_returns_none_not_50`) require the
  # WebSocket rewrite helpers (`absorb_book_update`, `_latest_prices`
  # cache attribute) that land in the P3 WebSocket rewrite (canonical
  # roadmap §5 P3). They are marked `@pytest.mark.xfail(strict=False)`
  # at source so both this `p0_gate` job and the full `tests` job
  # remain green; when P3 lands the WS rewrite and the helpers exist,
  # those tests flip to xpass (or pass after removing the decorator)
  # and signal the rewrite is integrated. No CLI-side --deselect is
  # required; the expected-red state lives with the tests.
  stage: test
  before_script:
    - *install
  script:
    - .venv/bin/python -m pytest
        tests/test_kalshi_normalizer_p0.py
        tests/test_kalshi_pricing_p0.py
        tests/test_kalshi_pricing_p0_replay.py
        tests/test_drift_counter_halt_p0.py
        tests/test_kalshi_signing_failfast.py
        -q --tb=short
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
